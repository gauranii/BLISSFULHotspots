# -----------------------------------------------------------------------------
# File:    .github/workflows/ci.yml
# Paper:   Gauran, Park, Rattsev, Peterson, Kann, Park (2022). Ann. Appl. Stat.
#          16(3):1459-1475.
# Purpose: Continuous integration: run `nix flake check` on every push and
#          pull request. The check builds every table and figure with the
#          default settings, compares them with the paper, and runs the unit
#          tests (README.md). No private data is needed.
# -----------------------------------------------------------------------------
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --print-build-logs
